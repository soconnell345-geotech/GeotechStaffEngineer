name: Tests

on:
  push:
    branches: [master]
    # A commit that touches only notes (BACKLOG, HANDOFF, plans, docs) does
    # not start the suite; a commit with any code in it still does.
    paths-ignore: ["**.md", "module_work/**", "docs/**"]
  pull_request:
    branches: [master]
  workflow_dispatch:

# A session pushes several commits an hour; only the newest needs testing.
# A newer push cancels the run still going (a cancelled run sends no
# failure e-mail).
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19.
    runs-on: ubuntu-24.04
    # The suite runs on four workers (pytest-xdist): 33-45 min a job, against
    # 50-100 min in one process. The four vCPUs are two cores, so each test
    # runs ~1.8x slower beside the others: ~2.2x overall. The time depends on
    # the CPU model the job draws, not the Python version. The limit stays
    # under GitHub's 6-hour job limit.
    timeout-minutes: 340
    strategy:
      # One Python version failing must not cancel the other's run.
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5
        with:
          # geotech-references is a PUBLIC submodule, so the default GITHUB_TOKEN
          # can fetch it. The old `token: ${{ secrets.SUBMODULE_PAT }}` line broke
          # checkout (empty/invalid secret -> 401) on every run since March 2026.
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install core package
        run: |
          pip install --upgrade pip
          # The core first (INF-32): the app pins aec-agent-core exactly and
          # it is not on PyPI until step 12, so `pip install -e .` finds it
          # already installed instead of looking for it.
          pip install -e packages/aec-agent-core
          pip install -e .
          pip install -e geotech-references/
          pip install pytest pytest-xdist

      - name: Install optional dependencies
        # Install what we can; some packages may fail on certain platforms.
        # Agent tests skip gracefully when their package is missing.
        run: |
          pip install matplotlib plotly jinja2 || true
          # v5.0 deepagents stack ([deep] extra) so funhouse_agent/deep tests run in CI
          pip install deepagents langchain langgraph langchain-anthropic "typing_extensions>=4.13" || true
          # pystrata by Python version (INF-68): 0.5 with pyrvt < 0.9 below
          # 3.13, 0.6 (which needs 3.13) from 3.13; mirrors pyproject.toml.
          pip install "pystrata>=0.5,<0.6; python_version < '3.13'" "pystrata>=0.6,<0.7; python_version >= '3.13'" "pyrvt<0.9; python_version < '3.13'" || true
          pip install eqsig || true
          pip install liquepy || true
          pip install pygef || true
          pip install gstools || true
          pip install python-ags4 || true
          pip install SALib || true
          pip install pystra || true
          pip install pydiggs || true
          pip install ezdxf || true
          pip install "PyMuPDF<2" || true   # planlens 0.13 (PyPI) misreads tables on 2.0; lift with planlens>=0.14 (INF-18)
          pip install pyproj || true   # foundry tier3 needs it

      - name: Runner CPU
        # Job times vary up to 2x with the CPU model GitHub assigns.
        run: lscpu | grep -E "Model name|^CPU\(s\)"

      - name: Run tests
        # -n auto: one worker per vCPU. worksteal hands out single tests
        # and rebalances, so a few multi-minute slope and FEM tests do not
        # leave the other workers idle at the end. The root conftest gives
        # each worker its own temp dir.
        run: pytest -n auto --dist worksteal -q --tb=short --durations=20

  wheels:
    # The app split's step 10 (INF-32): build the geotech-staff-engineer and
    # aec-agent-core wheels the way a release does (sdist, then the wheel),
    # install both into a fresh venv, import the entry points there and
    # check the file lists (webapp/tests/test_wheels.py). The 5.19.0 lesson:
    # a wheel can build and simply lack a package. The build half of that
    # file is opt-in: it runs only with GEOTECH_REQUIRE_WHEEL_TEST=1, which
    # this job sets (a missing 'build' is then a failure), so the main job
    # and nightly skip it. Run alone, in one process: two builds of the
    # root at once would share its source tree. A few minutes.
    name: "Wheels"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the core, then the app, and the build tools
        run: |
          pip install --upgrade pip
          pip install -e packages/aec-agent-core
          pip install -e . -e geotech-references/
          pip install pytest build "setuptools>=68" wheel

      - name: Build, install and check both wheels
        env:
          GEOTECH_REQUIRE_WHEEL_TEST: "1"
        run: pytest -q --tb=short webapp/tests/test_wheels.py

  core-only:
    # The app split's step 11 (c) (INF-32; plan module_work/APP_SPLIT_PLAN.md
    # section 5 and Step 11's Exit): the shared core with nothing geotech
    # installed. Only aec-agent-core, planlens from PyPI and CfA's fleet
    # pins (tinyapps/wrapper_repo/requirements-thirdparty.txt) are
    # installed; no geotech-references submodule, no analysis back end, not
    # geotech-staff-engineer. Every core module imports and the core's own
    # tests pass outside the checkout; then today's Document Review page is
    # built from this checkout's review files (on PYTHONPATH, every GSE
    # module refused) and runs one turn, and its fingerprints match the
    # recorded ones (webapp/tests/core_only.py). That proves the testers'
    # install before the copy of step 13. 3.11 is the test machine's 3.11.9,
    # 3.12 the App Service's. Minutes.
    name: "core-only"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
        # no submodules: the reference library is not part of this install

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the core, planlens and the fleet pins (nothing geotech)
        run: |
          pip install --upgrade pip
          pip install packages/aec-agent-core "planlens>=0.15" pytest
          pip install -r tinyapps/wrapper_repo/requirements-thirdparty.txt
          pip list
          python - <<'PY'
          import importlib.metadata as md, importlib.util as u, sys
          dists = [d for d in ("geotech-staff-engineer", "geotech-references")
                   if any(x.metadata["Name"] == d for x in md.distributions())]
          mods = [m for m in ("geotech_references", "pystrata", "liquepy",
                              "gstools", "openseespy", "SALib", "pystra")
                  if u.find_spec(m)]
          print("geotech installed:", dists, mods)
          sys.exit(1 if dists or mods else 0)
          PY

      - name: Every core module imports and the core's tests pass
        run: |
          T="$RUNNER_TEMP/core"
          mkdir -p "$T"
          cp -r packages/aec-agent-core/tests "$T/tests"
          ln -s "$(python -c 'import aec_agent_core, os; print(os.path.dirname(aec_agent_core.__file__))')" "$T/aec_agent_core"
          cd "$T"
          python -I - <<'PY'
          import importlib, pkgutil, sys
          import aec_agent_core
          names = [m.name for m in pkgutil.walk_packages(
              aec_agent_core.__path__, "aec_agent_core.")]
          for n in names:
              importlib.import_module(n)
          apps = sorted({m.split(".")[0] for m in sys.modules} & {
              "funhouse_agent", "webapp", "report_ingest",
              "geotech_references", "geotech_common", "calc_package",
              "profile_figure"})
          print(len(names), "core modules import; app modules loaded:", apps)
          sys.exit(1 if apps else 0)
          PY
          python -I -m pytest -q -p no:cacheprovider tests

      - name: Today's Document Review page builds, runs and matches
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m webapp.tests.core_only

  numpy126:
    # Foundry's transforms repos hold numpy at 1.26.4 (INF-53). Installs the
    # way docs/FOUNDRY.md says (the three packages with --no-deps, the rest
    # with constraints/foundry-numpy126.txt; no PyNiteFEA), then runs the
    # suites of the tools that broke there and of the code that keeps them
    # working: np.trapezoid in soe/downdrag, scipy's np.long in fem2d,
    # liquefaction, reliability, site response, kriging and Sobol.
    name: "numpy 1.26 (Foundry)"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install with numpy 1.26.4 and the constraints
        run: |
          pip install --upgrade pip
          pip install "numpy==1.26.4"
          pip install --no-deps -e packages/aec-agent-core -e . -e geotech-references/ "planlens>=0.15"
          python constraints/foundry_requirements.py > foundry-requirements.txt
          pip install -r foundry-requirements.txt -c constraints/foundry-numpy126.txt
          pip install pytest pytest-xdist -c constraints/foundry-numpy126.txt
          python -c "import numpy, scipy; print('numpy', numpy.__version__, 'scipy', scipy.__version__); assert numpy.__version__ == '1.26.4'"

      - name: Run tests
        # The modules of the 17 eval questions that failed on Foundry, the
        # files the fix touched, the eval keys that reproduce from the
        # modules (CON-1, FF-1, FTG-1, MRS-1), and the reviewers, whose
        # prompts must say the pynite tool is absent here. Slow-marked tests
        # are left to the main job: about 4 minutes on four workers on the
        # laptop.
        run: >-
          pytest -n auto --dist worksteal -q --tb=short --durations=10
          -m "not slow"
          soe downdrag fem2d liquepy_agent pystra_agent pystrata_agent
          seismic_signals_agent gstools_agent salib_agent reliability
          geotech_common pynite_agent lateral_pile/validation.py
          opensees_agent/tests/test_site_response_curves.py
          funhouse_agent/tests/test_structural_adapters.py
          funhouse_agent/tests/test_reviewers.py
          funhouse_agent/tests/test_eval_suite_v54.py
          validation_examples/test_published_v001_v005.py
