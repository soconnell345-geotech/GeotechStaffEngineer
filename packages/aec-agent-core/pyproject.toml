[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

# The core both agents run below their chat pages (the app split, BACKLOG
# INF-26 / INF-32; plan module_work/APP_SPLIT_PLAN.md sections 1.1 and 2.3).
# Step 10: the package exists, EMPTY apart from the alias helper, with its
# build, CI and a wheel test. Step 11 moved the code in, in three merges:
# (a), the model connections and the vision calls; (b), the figure helper,
# the plotting box and the chart stack; (c), the guards and records, Word
# and Excel, the checks, the document tools' binding, the shared assembly
# and the review suite's framework. Step 12 publishes it, on the owner's
# word. 1.0.0.dev0, empty, was published
# 2026-11-09 only to hold the name (publish-core.yml, tag core-v1.0.0.dev0).
# 1.0.0.dev1 since step 11 (a): a version PyPI does not have, so nothing
# built from master can install the empty 1.0.0.dev0 in its place, and
# publish.yml stops an app release until step 12 publishes this one.
# 1.0.0 since step 13 (INF-33): the first real release, published by the
# lead (tag core-v1.0.0) before GSE's release that pins it and before
# aec-document-review, which requires it exactly.
[project]
name = "aec-agent-core"
# Kept equal to geotech-staff-engineer's exact pin on it (its pyproject) and
# to aec_agent_core.__version__; webapp/tests/test_wheels.py checks all three.
version = "1.0.1"
description = "The shared core of LLM agents that review and produce architecture, engineering and construction documents: model connections, vision calls, guards and records, Word and Excel, and a figure helper. No user interface of its own."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    {name = "Sean O'Connell", email = "soconnell345@gmail.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
# The list of plan section 1.1, at the caps and floors geotech-staff-engineer
# has today (its pyproject carries the reasons for each; keep the two in
# step: webapp/tests/test_version_guard.py reads the agent-stack caps in both
# files). Nothing here installs anything new: every line is a core
# requirement of geotech-staff-engineer too (Pillow through matplotlib).
dependencies = [
    # numpy 1.26, not 2.0 (INF-53): Foundry's transforms repos hold 1.26.4.
    "numpy>=1.26",
    # The plotting box lets the model's code import scipy.
    "scipy>=1.13",
    # The agent stack, capped at the versions the offline gate exercised
    # (INF-03, 2026-10-27).
    "deepagents>=0.6.8,<0.7.25",
    "langchain>=1.3,<1.4.6",
    "langgraph>=1.2,<1.3",
    # langchain-protocol needs typing_extensions.TypedDict(extra_items=...)
    # (PEP 728), 4.13 or later; some hosts ship an older one.
    "typing_extensions>=4.13",
    # openai 3.x builds its own client on httpx2; 3.29.0 is the highest tested.
    "openai<3.29.1",
    "langchain-openai>=1.3",
    # The figure helper, the plotting box and the chart stack (in the core
    # since step 11 (b)): matplotlib draws, plotly writes the interactive
    # twin beside plot_data's PNG. The box also lets the model's code import
    # pandas; it is not required here (nor by the app): a script that names
    # it where it is not installed gets the import error, as in the app.
    "matplotlib>=3.8",
    "plotly>=5",
    # Word out (and in), Excel out and in (docx_renderer, office_text,
    # xlsx_writer: in the core since step 11 (c)). Step 11 (c) needs nothing
    # else new: the guards, records, checks, the assembly (deepagents and
    # langchain, above), the document tools' binding (planlens and PyMuPDF,
    # below), the DXF notes (ezdxf, through planlens) and the suite's
    # framework import only what is already listed.
    "python-docx>=1.1",
    "markdown-it-py>=3",
    "openpyxl>=3.1",
    # The document layer; the core binds its review tools. 0.15 since step
    # 11 (a): the app binds planlens.review (PL-29 (b)), and its pin is 0.15.
    "planlens>=0.15",
    # Step 11 (a), the vision tools: they open and render PDF pages with
    # PyMuPDF themselves (vision_tools, vision_view), so it is listed here,
    # not only through planlens; the range is the app's (INF-18: below 2
    # until the host probe), which settles step 10's open question for the
    # core. Already installed wherever planlens is.
    "PyMuPDF>=1.27.2,<2",
    # Step 11 (a), the vision tools: they size, crop and re-encode images
    # with Pillow (vision_view, image_view, vision_tools). matplotlib
    # already requires it (pillow>=8), so nothing new installs.
    "Pillow>=8",
]

[project.optional-dependencies]
# Claude through LangChain. GSE asks for it; a GPT-only host need not.
anthropic = ["langchain-anthropic>=1.4"]

[project.urls]
Homepage = "https://github.com/soconnell345-geotech/GeotechStaffEngineer"
Repository = "https://github.com/soconnell345-geotech/GeotechStaffEngineer"

[tool.setuptools.packages.find]
include = ["aec_agent_core*"]
exclude = ["*.tests", "*.tests.*", "tests*"]
